services:
  voxmind:
    build:
      context: .
      dockerfile: Dockerfile
    image: voxmind-api:latest
    container_name: voxmind-api
    ports:
      - "8090:8090"
    volumes:
      # Modèles ONNX (Parakeet STT + sherpa speaker) montés en lecture seule.
      # Récupérables depuis le conteneur Seren : voir docs/ — ~680 Mo.
      - ./models:/app/models:ro
    environment:
      - VOXMIND_MODELS_DIR=/app/models
      - VOXMIND_DATA_DIR=/app/data
    restart: unless-stopped
    # Permet à un autre conteneur (ex. AnythingLLM) de joindre l'hôte si besoin.
    extra_hosts:
      - "host.docker.internal:host-gateway"
