; Supervision des deux services de l'image VoxMind tout-en-un.
; Les deux process écrivent leurs logs sur la sortie standard du conteneur.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

; ── Sidecar TTS : serveur vLLM-omni Qwen3-TTS (GPU), API OpenAI sur 127.0.0.1:VLLM_PORT ──
[program:vllm-tts]
; --gpu-memory-utilization : FRACTION du GPU réservée en POOL STATIC par vLLM (pas la conso réelle).
;   Le 1.7B-TTS n'a besoin que de ~5-7 Go ; on garde donc une réservation modérée (défaut 0.5 = ~12 Go sur
;   une 3090), réglable via VLLM_GPU_MEM_UTIL pour une carte partagée avec le bureau / d'autres conteneurs.
command=vllm-omni serve %(ENV_QWEN3_MODEL)s
    --deploy-config /app/qwen3_tts.runtime.yaml
    --host 127.0.0.1 --port %(ENV_VLLM_PORT)s
    --gpu-memory-utilization %(ENV_VLLM_GPU_MEM_UTIL)s --trust-remote-code --omni
directory=/app/vllm-omni
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=30
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── API principale : VoxMind.Api (.NET), écoute sur 0.0.0.0:8000 (port issu de la config) ──
; Engines ONNX (Kokoro/Parakeet/speaker) en CPU, in-process ; moteur TTS « qwen3 » = client HTTP du sidecar.
[program:voxmind-api]
command=dotnet /app/voxmind/VoxMind.Api.dll
directory=/app/voxmind
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
priority=20
environment=VOXMIND_MODELS_DIR="%(ENV_VOXMIND_MODELS_DIR)s",VOXMIND_DATA_DIR="%(ENV_VOXMIND_DATA_DIR)s",DOTNET_gcServer="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
