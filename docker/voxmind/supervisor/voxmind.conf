; Supervision des deux services de l'image VoxMind tout-en-un.
; Les deux process écrivent leurs logs sur la sortie standard du conteneur.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

; ── Sidecar TTS : serveur vLLM-omni (GPU), API OpenAI sur 127.0.0.1:VLLM_PORT ──
; Le modèle servi dépend de TTS_BACKEND (qwen3 | voxtral) — géré par serve-tts.sh (un modèle à la fois).
[program:vllm-tts]
command=/app/serve-tts.sh
directory=/app/vllm-omni
autostart=true
autorestart=true
startsecs=15
stopwaitsecs=30
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── Watcher de bascule : recharge le sidecar vLLM quand VoxMind change le fichier d'état du backend ──
[program:backend-watch]
command=/app/backend-watch.sh
autostart=true
autorestart=true
startsecs=3
priority=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ── API principale : VoxMind.Api (.NET), écoute sur 0.0.0.0:8000 (port issu de la config) ──
; Engines ONNX (Kokoro/Parakeet/speaker) en CPU, in-process ; moteur TTS « qwen3 » = client HTTP du sidecar.
[program:voxmind-api]
command=dotnet /app/voxmind/VoxMind.Api.dll
directory=/app/voxmind
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
priority=20
environment=VOXMIND_MODELS_DIR="%(ENV_VOXMIND_MODELS_DIR)s",VOXMIND_DATA_DIR="%(ENV_VOXMIND_DATA_DIR)s",DOTNET_gcServer="1"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
